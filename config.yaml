# ============================================================================
# yadav-husain-dependency-length -- experiment configuration
#
# PRE-REGISTRATION NOTICE
# -----------------------
# The `thresholds` block below is pre-registered: it was written to disk BEFORE
# any results were generated, and it must not be edited after a run has produced
# results/verdict.json. The decision rules there are what convert this run from
# an illustration into a test. Changing them post hoc invalidates the run.
# ============================================================================

run:
  name: yadav-husain-dependency-length
  seed: 20260919          # master seed; per-sentence seeds derive from this
  max_ram_note: "treebanks are streamed one at a time; never hold all parses at once"

# ---------------------------------------------------------------------------
# Pre-registered decision rules (see README "Decision rules" section).
# ---------------------------------------------------------------------------
thresholds:
  # A hypothesis is SUPPORTED if >= support_fraction of qualifying treebanks
  # show the predicted effect with a bootstrap 95% CI excluding 0.
  support_fraction: 0.70
  # It is CONTRADICTED if < contradict_fraction of treebanks do.
  # Anything in between is EQUIVOCAL -- which is a legitimate, publishable result.
  contradict_fraction: 0.30
  # H3: RETIRED after pre-registration, and deliberately left here rather than
  # deleted, because silently dropping a pre-registered threshold is worse than
  # recording why it was abandoned.
  #
  # The original rule was: |beta(word_DL)| must shrink >= 50% when head_DL is
  # added. Logistic coefficients are not collapsible, so that comparison
  # measures rescaling, not derivativeness. Simulation (see run_h3's docstring)
  # shows it fails in both directions: it reports up to +73% shrinkage when the
  # two predictors are independent causes, and -81% "suppression" when
  # word_DL's true effect is exactly zero.
  #
  # H3 is now scored on whether word_DL retains an independent effect in a
  # conditional logit over matched pairs. No numeric threshold replaces this
  # one; the criterion is significance of beta(word_DL) at alpha, with the
  # nested LR test under FDR control.
  h3_shrinkage_min: null   # retired; no longer read by src/analysis.py
  # Alpha for the per-coefficient H3 criterion.
  h3_alpha: 0.05
  # H2 co-primary statistics, pre-registered 2026-09-19 for the full run, BEFORE
  # it was executed. Cliff's delta remains the primary and its verdict is
  # reported unchanged; these two are added because delta is tie-sensitive and
  # head_DL is the coarser metric, so delta penalizes it structurally.
  #
  # Two, not one, and deliberately chosen to fail differently:
  #   prob_advantage      -- ties split evenly; immune to coarseness
  #   median_rel_reduction -- per-sentence, so not dominated by long sentences
  # A ratio of summed DL was considered and rejected as the co-primary: it is
  # an effect on the corpus total, not on a typical sentence.
  #
  # Scoring: each is scored by the same 70/30 rule on its own bootstrap CI
  # excluding zero. They are reported separately and never pooled. Agreement
  # between them means the H2 comparison is robust to both tie structure and
  # length weighting; divergence is itself a reportable result.
  h2_coprimaries: [prob_advantage, median_rel_reduction]
  # Family-wise error control across treebanks, within each hypothesis family.
  fdr_q: 0.05
  # Bootstrap confidence level.
  ci_level: 0.95

bootstrap:
  n_resamples: 5000       # BCa resamples; resamples SENTENCES, not arcs
  fast_n_resamples: 500   # used under --fast

baselines:
  n_samples: 20           # random linearizations per real sentence
  fast_n_samples: 5
  kinds: [B1_uniform, B2_arity_preserving]

# ---------------------------------------------------------------------------
# The contested metric. Both `scope` settings are always computed; `scope` here
# only selects which one is the headline. The other is reported as robustness.
# ---------------------------------------------------------------------------
head_count:
  scope: global           # "global" | "within_span"
  include_endpoints: false

preprocessing:
  min_tokens: 3
  max_tokens: 100         # long-sentence tail is noisy and dominates DL means
  drop_multiword_tokens: true
  drop_empty_nodes: true
  # Flag (do not exclude) treebanks losing more than this share to validation.
  max_rejection_rate_warn: 0.15

filters:
  # Minimum analyzable sentences, after validation.
  #
  # Was 5000, which was never justified and cost the sample its typological
  # spread: Chinese, Turkish, Persian, Indonesian, Greek and Irish were all
  # excluded at 3.4k-4.8k sentences, leaving 10 of 17 treebanks Indo-European.
  #
  # Calibrated instead against the width of the H2 bootstrap CI. On en_ewt the
  # half-width of the magnitude contrast against its effect size runs:
  #
  #     n=400  -> 6.2x     n=2000 -> 13.4x    n=5000  -> 19.6x
  #     n=1000 -> 9.0x     n=3000 -> 14.4x    n=11108 -> 26.3x
  #
  # The effect is resolved many times over well below 5000. 1500 keeps the
  # ratio near 10x while admitting every treebank above ~1.5k sentences, and
  # per-treebank CIs are reported regardless so a small treebank's uncertainty
  # is visible rather than hidden behind an exclusion.
  min_sentences: 1500
  nonprojective_report_threshold: 0.20   # flag for separate reporting, not exclusion

download:
  ud_version: "2.14"
  github_raw_template: "https://raw.githubusercontent.com/UniversalDependencies/{repo}/master/{fname}"
  lindat_bulk_url: "https://lindat.mff.cuni.cz/repository/xmlui/bitstream/handle/11234/1-5502/ud-treebanks-v2.14.tgz"
  timeout_seconds: 120
  max_retries: 3

# ---------------------------------------------------------------------------
# Treebank list. `repo` is the GitHub repo name; `train` is the file to fetch.
# `family` and `order` are metadata used for reporting, not for selection.
# The manifest records which of these actually loaded at runtime.
# ---------------------------------------------------------------------------
treebanks:
  - {id: en_ewt,      repo: UD_English-EWT,        train: en_ewt-ud-train.conllu,      family: Indo-European, order: SVO}
  - {id: de_gsd,      repo: UD_German-GSD,         train: de_gsd-ud-train.conllu,      family: Indo-European, order: SVO}
  - {id: fr_gsd,      repo: UD_French-GSD,         train: fr_gsd-ud-train.conllu,      family: Indo-European, order: SVO}
  - {id: es_ancora,   repo: UD_Spanish-AnCora,     train: es_ancora-ud-train.conllu,   family: Indo-European, order: SVO}
  # SynTagRus ships train as three shards; train_parts are concatenated.
  - {id: ru_syntagrus, repo: UD_Russian-SynTagRus, train: ru_syntagrus-ud-train.conllu, family: Indo-European, order: SVO,
     train_parts: [ru_syntagrus-ud-train-a.conllu, ru_syntagrus-ud-train-b.conllu, ru_syntagrus-ud-train-c.conllu]}
  - {id: pl_pdb,      repo: UD_Polish-PDB,         train: pl_pdb-ud-train.conllu,      family: Indo-European, order: SVO}
  # PDT was renamed to PDT-C upstream and ships train as eleven shards.
  - {id: cs_pdt,      repo: UD_Czech-PDT,          train: cs_pdt-ud-train.conllu,      family: Indo-European, order: SVO,
     train_parts: [cs_pdtc-ud-train-ca.conllu, cs_pdtc-ud-train-ct.conllu, cs_pdtc-ud-train-ft.conllu,
                   cs_pdtc-ud-train-la.conllu, cs_pdtc-ud-train-lt.conllu, cs_pdtc-ud-train-ma.conllu,
                   cs_pdtc-ud-train-mt.conllu, cs_pdtc-ud-train-st.conllu, cs_pdtc-ud-train-va.conllu,
                   cs_pdtc-ud-train-wt0.conllu, cs_pdtc-ud-train-wt1.conllu, cs_pdtc-ud-train-wt2.conllu]}
  - {id: it_isdt,     repo: UD_Italian-ISDT,       train: it_isdt-ud-train.conllu,     family: Indo-European, order: SVO}
  - {id: pt_bosque,   repo: UD_Portuguese-Bosque,  train: pt_bosque-ud-train.conllu,   family: Indo-European, order: SVO}
  - {id: hi_hdtb,     repo: UD_Hindi-HDTB,         train: hi_hdtb-ud-train.conllu,     family: Indo-European, order: SOV}
  - {id: fa_seraji,   repo: UD_Persian-Seraji,     train: fa_seraji-ud-train.conllu,   family: Indo-European, order: SOV}
  - {id: el_gdt,      repo: UD_Greek-GDT,          train: el_gdt-ud-train.conllu,      family: Indo-European, order: SVO}
  - {id: la_ittb,     repo: UD_Latin-ITTB,         train: la_ittb-ud-train.conllu,     family: Indo-European, order: SOV}
  - {id: ga_idt,      repo: UD_Irish-IDT,          train: ga_idt-ud-train.conllu,      family: Indo-European, order: VSO}
  - {id: lv_lvtb,     repo: UD_Latvian-LVTB,       train: lv_lvtb-ud-train.conllu,     family: Indo-European, order: SVO}
  - {id: fi_tdt,      repo: UD_Finnish-TDT,        train: fi_tdt-ud-train.conllu,      family: Uralic,        order: SVO}
  - {id: et_edt,      repo: UD_Estonian-EDT,       train: et_edt-ud-train.conllu,      family: Uralic,        order: SVO}
  - {id: hu_szeged,   repo: UD_Hungarian-Szeged,   train: hu_szeged-ud-train.conllu,   family: Uralic,        order: free}
  - {id: tr_imst,     repo: UD_Turkish-IMST,       train: tr_imst-ud-train.conllu,     family: Turkic,        order: SOV}
  - {id: ug_udt,      repo: UD_Uyghur-UDT,         train: ug_udt-ud-train.conllu,      family: Turkic,        order: SOV}
  - {id: ar_padt,     repo: UD_Arabic-PADT,        train: ar_padt-ud-train.conllu,     family: Afro-Asiatic,  order: VSO}
  - {id: he_htb,      repo: UD_Hebrew-HTB,         train: he_htb-ud-train.conllu,      family: Afro-Asiatic,  order: SVO}
  # am_att is TEST-ONLY upstream (no train file exists), so it cannot be used
  # here without mixing a test split into a training-data analysis. Left in
  # place, commented, so the omission is visible rather than silent.
  # - {id: am_att,    repo: UD_Amharic-ATT,        train: am_att-ud-train.conllu,      family: Afro-Asiatic,  order: SOV}
  - {id: zh_gsd,      repo: UD_Chinese-GSD,        train: zh_gsd-ud-train.conllu,      family: Sino-Tibetan,  order: SVO}
  - {id: ja_gsd,      repo: UD_Japanese-GSD,       train: ja_gsd-ud-train.conllu,      family: Japonic,       order: SOV}
  - {id: ko_kaist,    repo: UD_Korean-Kaist,       train: ko_kaist-ud-train.conllu,    family: Koreanic,      order: SOV}
  - {id: id_gsd,      repo: UD_Indonesian-GSD,     train: id_gsd-ud-train.conllu,      family: Austronesian,  order: SVO}
  - {id: ta_ttb,      repo: UD_Tamil-TTB,          train: ta_ttb-ud-train.conllu,      family: Dravidian,     order: SOV}
  - {id: wo_wtb,      repo: UD_Wolof-WTB,          train: wo_wtb-ud-train.conllu,      family: Niger-Congo,   order: SVO}
  - {id: eu_bdt,      repo: UD_Basque-BDT,         train: eu_bdt-ud-train.conllu,      family: isolate,       order: SOV}

fast_treebanks: [en_ewt, ja_gsd, tr_imst, ar_padt, fi_tdt]

paths:
  raw_dir: data/raw
  results_dir: results
  figures_dir: results/figures
  fixture: tests/fixtures/mini.conllu
